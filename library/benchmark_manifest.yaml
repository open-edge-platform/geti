      - name: rfdetr_seg_xlarge_tile
        priority: core
        recipe: instance_segmentation/rfdetr_seg_xlarge_tile.yaml
      - name: rfdetr_seg_2xlarge_tile
        priority: core
        recipe: instance_segmentation/rfdetr_seg_2xlarge_tile.yaml
    datasets:
      - wgisd
    criteria:
      accuracy_metric: map_50
