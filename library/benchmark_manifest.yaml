    criteria:
      accuracy_metric: Dice
      thresholds:
        "training:val/{metric}": { compare: ">=", margin: 0.10 }
        "torch:test/{metric}": { compare: ">=", margin: 0.10 }
        "export:test/{metric}": { compare: ">=", margin: 0.10 }
        "training:train/iter_time": { compare: "<=", margin: 0.10 }
        "training:gpu_mem": { compare: "<=", margin: 0.10 }
        "torch:test/latency": { compare: "<=", margin: 0.15 }
  instance_segmentation:
    models:
      # --- tiling disabled (base recipes) ---
      - name: maskrcnn_efficientnetb2b
        priority: core
        recipe: instance_segmentation/maskrcnn_efficientnetb2b.yaml
      - name: maskrcnn_r50
        priority: core
        recipe: instance_segmentation/maskrcnn_r50.yaml
      - name: maskrcnn_swint
        priority: core
        recipe: instance_segmentation/maskrcnn_swint.yaml
      - name: rtmdet_inst_tiny
        priority: core
        recipe: instance_segmentation/rtmdet_inst_tiny.yaml
      - name: rfdetr_seg_nano
