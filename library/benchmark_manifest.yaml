      # --- tiling enabled (_tile recipes) ---
      - name: maskrcnn_efficientnetb2b_tile
        priority: core
        recipe: instance_segmentation/maskrcnn_efficientnetb2b_tile.yaml
      - name: maskrcnn_r50_tile
        priority: core
        recipe: instance_segmentation/maskrcnn_r50_tile.yaml
      - name: maskrcnn_swint_tile
        priority: core
        recipe: instance_segmentation/maskrcnn_swint_tile.yaml
      - name: rtmdet_inst_tiny_tile
        priority: core
        recipe: instance_segmentation/rtmdet_inst_tiny_tile.yaml
      - name: rfdetr_seg_nano_tile
        priority: core
        recipe: instance_segmentation/rfdetr_seg_nano_tile.yaml
      - name: rfdetr_seg_small_tile
        priority: core
        recipe: instance_segmentation/rfdetr_seg_small_tile.yaml
      - name: rfdetr_seg_medium_tile
        priority: core
