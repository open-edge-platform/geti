# OTX Benchmark Manifest — defines WHAT to run
#
# The manifest declares models, dataset references, scenarios, and
# regression criteria for each task.  The runner iterates over the
# cross-product (model × dataset × scenario × seed) after applying
# any runtime filters.
version: 1
defaults:
  num_seeds: 2
  eval_upto: optimize
  deterministic: false # Setting to true is extremely slow for certain models
  rotation:
    extended_groups: 2
experiments:
  detection:
    models:
      # --- tiling disabled (base recipes) ---
      - name: atss_mobilenetv2
        priority: core
        recipe: detection/atss_mobilenetv2.yaml
      - name: ssd_mobilenetv2
        priority: core
        recipe: detection/ssd_mobilenetv2.yaml
      - name: yolox_tiny
        priority: core
        recipe: detection/yolox_tiny.yaml
      - name: yolox_s
        priority: core
        recipe: detection/yolox_s.yaml
      - name: yolox_l
        priority: core
        recipe: detection/yolox_l.yaml
      - name: yolox_x
        priority: core
        recipe: detection/yolox_x.yaml
      - name: rtdetr_50
        priority: core
        recipe: detection/rtdetr_50.yaml
      - name: deim_dfine_m
        priority: core
        recipe: detection/deim_dfine_m.yaml
      - name: deim_dfine_l
        priority: core
        recipe: detection/deim_dfine_l.yaml
      - name: deim_dfine_x
        priority: core
        recipe: detection/deim_dfine_x.yaml
      - name: deimv2_s
        priority: core
        recipe: detection/deimv2_s.yaml
      - name: deimv2_m
        priority: core
        recipe: detection/deimv2_m.yaml
      - name: deimv2_l
        priority: core
        recipe: detection/deimv2_l.yaml
      - name: rfdetr_nano
        priority: core
        recipe: detection/rfdetr_nano.yaml
      - name: rfdetr_small
        priority: core
        recipe: detection/rfdetr_small.yaml
      - name: rfdetr_medium
        priority: core
        recipe: detection/rfdetr_medium.yaml
      - name: rfdetr_large
        priority: core
        recipe: detection/rfdetr_large.yaml
      - name: dfine_x
        priority: core
        recipe: detection/dfine_x.yaml
      # --- tiling enabled (_tile recipes) ---
      - name: atss_mobilenetv2_tile
        priority: core
        recipe: detection/atss_mobilenetv2_tile.yaml
      - name: ssd_mobilenetv2_tile
        priority: core
        recipe: detection/ssd_mobilenetv2_tile.yaml
      - name: yolox_tiny_tile
        priority: core
        recipe: detection/yolox_tiny_tile.yaml
      - name: yolox_s_tile
        priority: core
        recipe: detection/yolox_s_tile.yaml
      - name: yolox_l_tile
        priority: core
        recipe: detection/yolox_l_tile.yaml
      - name: yolox_x_tile
        priority: core
        recipe: detection/yolox_x_tile.yaml
      - name: rtdetr_50_tile
        priority: core
        recipe: detection/rtdetr_50_tile.yaml
      - name: deim_dfine_m_tile
        priority: core
        recipe: detection/deim_dfine_m_tile.yaml
      - name: deim_dfine_l_tile
        priority: core
        recipe: detection/deim_dfine_l_tile.yaml
      - name: deim_dfine_x_tile
        priority: core
        recipe: detection/deim_dfine_x_tile.yaml
      - name: deimv2_s_tile
        priority: core
        recipe: detection/deimv2_s_tile.yaml
      - name: deimv2_m_tile
        priority: core
        recipe: detection/deimv2_m_tile.yaml
      - name: deimv2_l_tile
        priority: core
        recipe: detection/deimv2_l_tile.yaml
      - name: rfdetr_nano_tile
        priority: core
        recipe: detection/rfdetr_nano_tile.yaml
      - name: rfdetr_small_tile
        priority: core
        recipe: detection/rfdetr_small_tile.yaml
      - name: rfdetr_medium_tile
        priority: core
        recipe: detection/rfdetr_medium_tile.yaml
      - name: rfdetr_large_tile
        priority: core
        recipe: detection/rfdetr_large_tile.yaml
      - name: dfine_x_tile
        priority: core
        recipe: detection/dfine_x_tile.yaml
    datasets:
      - bccd
    criteria:
      accuracy_metric: map_50
      thresholds:
        "training:val/{metric}": { compare: ">=", margin: 0.10 }
        "torch:test/{metric}": { compare: ">=", margin: 0.10 }
        "export:test/{metric}": { compare: ">=", margin: 0.10 }
        "training:train/iter_time": { compare: "<=", margin: 0.10 }
        "training:gpu_mem": { compare: "<=", margin: 0.10 }
        "torch:test/latency": { compare: "<=", margin: 0.15 }
  semantic_segmentation:
