backend: huggingface
task: INSTANCE_SEGMENTATION

model:
  class_path: getitune.backend.huggingface.models.instance_segmentation.HFInstSegModel
  init_args:
    checkpoint: facebook/mask2former-swin-tiny-coco-instance
    pretrained: true
    input_size:
      - 640
      - 640
    mean:
      - 0.485
      - 0.456
      - 0.406
    std:
      - 0.229
      - 0.224
      - 0.225

engine:
  device: auto

training:
  max_epochs: 100
  batch: 4
  learning_rate: 0.0001
  precision: bf16-mixed
  patience: 10

data: ../_base_/data/instance_segmentation.yaml

overrides:
  data:
    input_size:
      - 640
      - 640
