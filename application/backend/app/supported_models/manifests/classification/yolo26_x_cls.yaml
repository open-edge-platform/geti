id: image-classification-yolo26-x
name: YOLO26-X
license: AGPL-3.0

pretrained_weights:
  url: https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo26x.pt
  mirror_url: https://huggingface.co/Ultralytics/YOLO26/resolve/main/yolo26x.pt
  sha_sum: "ee88a0c71e9596cdfdbb71892725929cb4489b874d24fb581d20bffe79724386"

description: "YOLO26-X is the extra-large Ultralytics YOLO26 classification model. It targets maximum accuracy while using the Geti Tune data pipeline for preprocessing and dataset handling."
stats:
  gigaflops: 13.6
  trainable_parameters: 29.6
  benchmark_metrics:
    imagenet_top1_accuracy: 79.9
    imagenet_top5_accuracy: 95.0

hyperparameters:
  training:
    learning_rate: 0.001
    weight_decay: 0.0005
    max_epochs: 90
    early_stopping:
      enable: false
    batch_size: 64
    input_size_width: 224
    input_size_height: 224
    scheduler:
      type: cosine_annealing
      warmup:
        enable: false
    gradient_clip:
      enable: true
      max_grad_norm: 10.0
    gradient_accumulation:
      enable: false
