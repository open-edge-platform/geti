[package]
name = "geti_ui"
version = "3.2.0"
description = "Geti UI"
authors = ["Intel"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-fs = "=2.5.1"
tauri-plugin-log = "2.8.0"
tauri-plugin-opener = "2.5.3"

# "Annotate with ChatGPT" assistant (src/assistant). The OpenAI request is made
# here rather than in the webview so the API key never reaches renderer JS:
# `keyring` keeps it in the OS credential store, `reqwest` streams the SSE
# response, and `tokio`'s process support drives the optional `codex
# app-server` subprocess used by the ChatGPT-account mode.
#
# `rustls-tls` (rather than reqwest's default native-tls) keeps the desktop
# shell free of an OpenSSL build dependency on Linux.
keyring = { version = "3", default-features = false }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "sync", "time"] }

# Desktop-only: guarantees a single running instance so no two
# backends are spawned competing for the same TCP port and SQLite database.
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "=2.4.4"

# Windows-only: Job Objects to bind the side-car's process tree to the shell's
# lifetime, and the WebView2 COM interfaces needed to observe `ProcessFailed`
# (Evergreen runtime updates / GPU crashes) instead of dying.
#
# Deliberately *not* pinned with `=`: these must resolve to the very same crate
# versions that tauri 2.11 / wry 0.55 already depend on, otherwise the COM types
# we hand to `add_ProcessFailed` come from a different copy of the crate and no
# longer match wry's. Caret ranges let Cargo unify them into a single build;
# Cargo.lock records the exact versions (windows 0.61.3, webview2-com 0.38.2).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_JobObjects",
] }
webview2-com = "0.38"
# Windows Credential Manager backing store for the assistant's OpenAI API key.
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Keychain backing store for the assistant's OpenAI API key.
keyring = { version = "3", default-features = false, features = ["apple-native"] }

