name: Getidata library checks

on:
  merge_group:
    branches:
      - develop
      - release/**
  push:
    tags:
      - "v*"
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions: {} # No permissions by default

concurrency:
  group: getidata-lint-and-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Determines if workflow should execute based on event type and changed paths
  # If push or workflow_dispatch -> always run
  # If PR or merge_group -> run only if files in specified paths changed
  check-paths:
    name: Check if workflow should run
    runs-on: ubuntu-latest
    outputs:
      run_workflow: ${{ steps.check_paths.outputs.run }}
    steps:
      - &harden-runner
        name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - &checkout
        name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check paths
        id: check_paths
        uses: open-edge-platform/geti-ci/actions/check-paths@2ed3ce382d1dbd6db52c7c6b93ffdae280a1c06f # check-paths/v0.1.0
        with:
          files_yaml: |
            test:
              - libraries/getidata/**
              - .github/workflows/getidata-lint-and-test.yaml
              - .github/actions/install-common-deps/**
              - '!**/*.md'

  code-quality-checks:
    runs-on: ubuntu-latest
    needs: check-paths
    if: needs.check-paths.outputs.run_workflow == 'true'
    permissions:
      contents: read
    steps:
      - *harden-runner

      - *checkout

      - name: Install Python, uv and Just
        uses: ./.github/actions/install-common-deps
        with:
          uv-version-file: libraries/getidata/pyproject.toml # Install the uv version specified in pyproject.toml
          python-version: "3.11" # Use the lowest supported Python version for linting/type-checking

      - name: Prepare venv and install Python dependencies
        working-directory: libraries/getidata
        run: just venv

      - name: Run linters and type-checkers
        working-directory: libraries/getidata
        run: just lint

  # getidata is pure Python and meant to be portable, so test on all the main platforms.
  tests:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # The id-token permission is required by Codecov to use OIDC
      id-token: write
    needs:
      - check-paths
    if: needs.check-paths.outputs.run_workflow == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-24.04", "windows-2022", "macos-15"]
        python-version: ["3.11", "3.14"]
    name: tests-${{ matrix.os }}-Python${{ matrix.python-version }}
    steps:
      # YAML anchors not used cause currently zizmor don't support them in matrix strategies
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Python, uv and Just
        uses: ./.github/actions/install-common-deps
        with:
          uv-version-file: libraries/getidata/pyproject.toml # Install the uv version specified in pyproject.toml
          python-version: ${{ matrix.python-version }}

      - name: Installing dependencies
        working-directory: libraries/getidata
        run: just venv

      - name: Unit testing
        working-directory: libraries/getidata
        run: just test-unit --cov --cov-report=xml --cov-append

      - name: Integration testing
        working-directory: libraries/getidata
        run: just test-integration --cov --cov-report=xml --cov-append

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          directory: libraries/getidata
          flags: getidata_${{ matrix.os }}_Python-${{ matrix.python-version }}
          use_oidc: true

  required-check:
    name: Required Check getidata-lint-and-test
    needs:
      - check-paths
      - code-quality-checks
      - tests
    runs-on: ubuntu-latest
    env:
      CHECKS: ${{ join(needs.*.result, ' ') }}
    if: always() && !cancelled()
    steps:
      - *harden-runner

      - name: Check jobs results
        run: |
          for check in ${CHECKS}; do
            echo "::notice::check=${check}"
            if [[ "$check" != "success" && "$check" != "skipped" ]]; then
              echo "::error ::Required status checks failed. They must succeed before this pull request can be merged."
              exit 1
            fi
          done
