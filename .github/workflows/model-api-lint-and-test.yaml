name: Model API library checks

on:
  merge_group:
    branches:
      - develop
      - release/**
  push:
    tags:
      - "v*"
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions: {} # No permissions by default

concurrency:
  group: model-api-lint-and-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Determines if workflow should execute based on event type and changed paths
  # If push or workflow_dispatch -> always run
  # If PR or merge_group -> run only if files in specified paths changed
  check-paths:
    name: Check if workflow should run
    runs-on: ubuntu-latest
    outputs:
      run_workflow: ${{ steps.check_paths.outputs.run }}
    steps:
      - &harden-runner
        name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - &checkout
        name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check paths
        id: check_paths
        uses: open-edge-platform/geti-ci/actions/check-paths@2ed3ce382d1dbd6db52c7c6b93ffdae280a1c06f # check-paths/v0.1.0
        with:
          files_yaml: |
            test:
              - libraries/model_api/**
              - .github/workflows/model-api-lint-and-test.yaml
              - .github/actions/install-common-deps/**
              - '!**/*.md'

  code-quality-checks:
    runs-on: ubuntu-latest
    needs: check-paths
    if: needs.check-paths.outputs.run_workflow == 'true'
    permissions:
      contents: read
    steps:
      - *harden-runner

      - *checkout

      - name: Install Python, uv and Just
        uses: $/.github/actions/install-common-deps
        with:
          uv-version-file: libraries/model_api/pyproject.toml # Install the uv version specified in pyproject.toml
          python-version: "3.11" # Use the lowest supported Python version for linting/type-checking

      - &venv
        name: Prepare venv and install Python dependencies
        working-directory: libraries/model_api
        run: just venv

      - name: Run linters and type-checkers
        working-directory: libraries/model_api
        run: just lint

  tests:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # The id-token permission is required by Codecov to use OIDC
      id-token: write
    needs:
      - check-paths
    if: needs.check-paths.outputs.run_workflow == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        exclude:
          - os: "windows-latest"
            python-version: "3.14" # started to fail with "Windows fatal exception: access violation"
    name: tests-${{ matrix.os }}-Python${{ matrix.python-version }}
    steps:
      - *harden-runner

      - *checkout

      - name: Install Python, uv and Just
        uses: $/.github/actions/install-common-deps
        with:
          uv-version-file: libraries/model_api/pyproject.toml # Install the uv version specified in pyproject.toml
          python-version: ${{ matrix.python-version }}

      - *venv

      - name: Unit testing
        working-directory: libraries/model_api
        run: just test-unit --cov --cov-report=xml --cov-append

      - &test-data
        name: Prepare test data
        working-directory: libraries/model_api
        run: just test-functional-download-models -d data

      - name: Unit testing
        working-directory: libraries/model_api
        run: just test-functional --data=./data tests/functional

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          directory: libraries/model_api
          flags: model_api_Python-${{ matrix.os }}-${{ matrix.python-version }}
          use_oidc: true

  serving_api-tests:
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-latest"
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: ${{ matrix.os }}
    needs:
      - check-paths
    steps:
      - *harden-runner

      - *checkout

      - name: Install Python, uv and Just
        uses: $/.github/actions/install-common-deps
        with:
          uv-version-file: libraries/model_api/pyproject.toml # Install the uv version specified in pyproject.toml
          python-version: ${{ matrix.python-version }}

      - *venv

      - *test-data

      - name: serving_api
        working-directory: libraries/model_api
        run: |
          uv run python -c "from model_api.models import Model; Model.create_model('./data/otx_models/ssd-card-detection.xml').save('ovms_models/ssd-card-detection/1/ssd-card-detection.xml')"
          docker run -d --rm -v $PWD/ovms_models/:/models -p 8000:8000 openvino/model_server:latest --model_path /models/ssd-card-detection/ --model_name ssd-card-detection --rest_port 8000 --log_level DEBUG --target_device CPU
          echo "Waiting for OVMS to be ready..."
          timeout 120 bash -c 'until curl -sf http://localhost:8000/v2/health/ready; do sleep 3; done'
          uv run python examples/serving_api/run.py data/coco128/images/train2017/000000000009.jpg  # detects 4 objects

  required-check:
    name: Required Check model-api-lint-and-test
    needs:
      - check-paths
      - code-quality-checks
      - tests
      - serving_api-tests
    runs-on: ubuntu-latest
    env:
      CHECKS: ${{ join(needs.*.result, ' ') }}
    if: always() && !cancelled()
    steps:
      - *harden-runner

      - name: Check jobs results
        run: |
          for check in ${CHECKS}; do
            echo "::notice::check=${check}"
            if [[ "$check" != "success" && "$check" != "skipped" ]]; then
              echo "::error ::Required status checks failed. They must succeed before this pull request can be merged."
              exit 1
            fi
          done
