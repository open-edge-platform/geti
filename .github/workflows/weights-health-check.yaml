name: Pretrained Weights URL Health Check

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC daily, after the main daily.yml at 02:00
  workflow_dispatch:

permissions: {}

jobs:
  check-weights-urls:
    name: Check pretrained weights URLs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      failure_count: ${{ steps.probe.outputs.failure_count }}
      failures: ${{ steps.probe.outputs.failures }}
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Probe pretrained weights URLs
        id: probe
        run: |
          set -euo pipefail
          MANIFESTS_DIR="application/backend/app/supported_models/manifests"

          probe_url() {
            local model_id="$1" model_name="$2" url="$3"
            local result code time_s bytes_dl url_eff curl_exit
            # Capture status, timing, bytes received, and final URL after redirects
            result=$(curl --silent --output /dev/null \
                          --write-out "%{http_code}|%{time_total}|%{size_download}|%{url_effective}" \
                          --range 0-65535 --max-filesize 131072 --location \
                          --max-time 30 --connect-timeout 10 \
                          --retry 3 --retry-delay 2 "$url") && curl_exit=0 || curl_exit=$?
            IFS='|' read -r code time_s bytes_dl url_eff <<< "$result"
            if [[ "$code" =~ ^(200|206)$ ]]; then
              printf 'OK   %-45s  http=%s  %.2fs  %d B  -> %s\n' \
                "$model_name" "$code" "$time_s" "$bytes_dl" "$url_eff"
            elif [[ "$curl_exit" -eq 63 ]]; then
              # exit 63 = CURLE_FILESIZE_EXCEEDED: Range not honoured but server is live
              printf 'OK   %-45s  http=%s  %.2fs  (range unsupported, capped)  -> %s\n' \
                "$model_name" "$code" "$time_s" "$url_eff"
            else
              printf 'FAIL %-45s  http=%s  %.2fs  %s\n' \
                "$model_name" "$code" "$time_s" "$url"
              printf '%s\t%s\t%s\t%s\n' "$model_id" "$model_name" "$url" "$code" \
                >> /tmp/failures.tsv
            fi
          }
          export -f probe_url

          # Negative self-test: a nonexistent GCS key in a known-public bucket must be detected as failed
          probe_url "__self_test__" "[self-test]" \
            "https://storage.googleapis.com/rfdetr/this-file-does-not-exist-geti-ci-test.pth"
          if ! grep -q "__self_test__" /tmp/failures.tsv 2>/dev/null; then
            echo "::error::Self-test failed — probe_url did not detect a broken URL"
            exit 1
          fi
          : > /tmp/failures.tsv  # clear self-test entry before real probing

          # Process substitution keeps the while loop in the main shell so RUNNING stays in scope
          RUNNING=0
          TOTAL=0
          while IFS=$'\t' read -r model_id model_name url; do
            # Throttle before starting to never exceed 8 concurrent jobs
            while (( RUNNING >= 8 )); do
              wait -n 2>/dev/null || true
              RUNNING=$(( RUNNING - 1 ))
            done
            probe_url "$model_id" "$model_name" "$url" &
            RUNNING=$(( RUNNING + 1 ))
            TOTAL=$(( TOTAL + 1 ))
          done < <(find "$MANIFESTS_DIR" -name '*.yaml' ! -name 'base.yaml' | sort | \
                   xargs yq -r '[.id, .name, .pretrained_weights.url] | @tsv')
          wait

          FAILED=$(wc -l < /tmp/failures.tsv 2>/dev/null || echo 0)
          echo "Probed ${TOTAL} URL(s): $(( TOTAL - FAILED )) OK, ${FAILED} failed"

          if [[ -s /tmp/failures.tsv ]]; then
            echo "failure_count=${FAILED}" >> "$GITHUB_OUTPUT"
            { echo "failures<<EOF"; cat /tmp/failures.tsv; echo "EOF"; } >> "$GITHUB_OUTPUT"
            {
              echo "## :x: Pretrained Weights URL Health Check — ${FAILED} failure(s)"
              echo ""
              echo "| Model | URL | HTTP Status |"
              echo "|-------|-----|-------------|"
              while IFS=$'\t' read -r _id name url code; do
                echo "| ${name} | ${url} | \`${code}\` |"
              done < /tmp/failures.tsv
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "failure_count=0" >> "$GITHUB_OUTPUT"
          echo "## :white_check_mark: Pretrained Weights URL Health Check — all URLs reachable" \
            >> "$GITHUB_STEP_SUMMARY"
