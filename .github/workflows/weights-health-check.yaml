name: Pretrained Weights URL Health Check

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC daily, after the main daily.yml at 02:00
  workflow_dispatch:

permissions: {}

jobs:
  check-weights-urls:
    name: Check pretrained weights URLs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      failure_count: ${{ steps.probe.outputs.failure_count }}
      failures: ${{ steps.probe.outputs.failures }}
    steps:
      - &harden-runner
        name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Probe pretrained weights URLs
        id: probe
        run: |
          set -euo pipefail
          MANIFESTS_DIR="application/backend/app/supported_models/manifests"

          probe_url() {
            local model_id="$1" model_name="$2" url="$3"
            local code curl_exit
            # Download first 64 KB; 206 = Range honoured, 200 = Range ignored (full file sent)
            # --max-filesize caps accidental full downloads at 128 KB; exit 63 = size exceeded
            code=$(curl --silent --output /dev/null --write-out "%{http_code}" \
                        --range 0-65535 --max-filesize 131072 --location \
                        --max-time 30 --connect-timeout 10 \
                        --retry 3 --retry-delay 2 "$url") && curl_exit=0 || curl_exit=$?
            if [[ "$code" =~ ^(200|206)$ ]] || [[ "$curl_exit" -eq 63 ]]; then
              echo "OK   $model_name"
            else
              echo "FAIL $model_name — HTTP $code — $url"
              printf '%s\t%s\t%s\t%s\n' "$model_id" "$model_name" "$url" "$code" \
                >> /tmp/failures.tsv
            fi
          }
          export -f probe_url

          # Negative self-test: a nonexistent GCS key in a known-public bucket must be detected as failed
          probe_url "__self_test__" "[self-test]" \
            "https://storage.googleapis.com/rfdetr/this-file-does-not-exist-geti-ci-test.pth"
          if ! grep -q "__self_test__" /tmp/failures.tsv 2>/dev/null; then
            echo "::error::Self-test failed — probe_url did not detect a broken URL"
            exit 1
          fi
          : > /tmp/failures.tsv  # clear self-test entry before real probing

          # Process substitution keeps the while loop in the main shell so RUNNING stays in scope
          RUNNING=0
          while IFS=$'\t' read -r model_id model_name url; do
            probe_url "$model_id" "$model_name" "$url" &
            RUNNING=$(( RUNNING + 1 ))
            if (( RUNNING >= 8 )); then
              wait -n 2>/dev/null || true
              RUNNING=$(( RUNNING - 1 ))
            fi
          done < <(find "$MANIFESTS_DIR" -name '*.yaml' ! -name 'base.yaml' | sort | \
                   xargs -I{} yq -r '[.id, .name, .pretrained_weights.url] | @tsv' {})
          wait

          if [[ -s /tmp/failures.tsv ]]; then
            FAILURE_COUNT=$(wc -l < /tmp/failures.tsv)
            echo "failure_count=${FAILURE_COUNT}" >> "$GITHUB_OUTPUT"
            { echo "failures<<EOF"; cat /tmp/failures.tsv; echo "EOF"; } >> "$GITHUB_OUTPUT"
            {
              echo "## :x: Pretrained Weights URL Health Check — ${FAILURE_COUNT} failure(s)"
              echo ""
              echo "| Model | URL | HTTP Status |"
              echo "|-------|-----|-------------|"
              while IFS=$'\t' read -r _id name url code; do
                echo "| ${name} | ${url} | \`${code}\` |"
              done < /tmp/failures.tsv
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "failure_count=0" >> "$GITHUB_OUTPUT"
          echo "## :white_check_mark: Pretrained Weights URL Health Check — all URLs reachable" \
            >> "$GITHUB_STEP_SUMMARY"
