# Builds the getitrack Sphinx documentation and publishes it to GitHub Pages.
# GitHub Pages must be enabled for the repository (Settings -> Pages -> Source:
# GitHub Actions) before the deploy job can publish.
name: getitrack docs

on:
  push:
    branches: [feature/getitrack]
    paths:
      - "libraries/getitrack/src/**"
      - "libraries/getitrack/docs/**"
      - ".github/workflows/getitrack-docs.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: getitrack-docs
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install docs dependencies
        # astroid pinned <4: sphinx-autoapi 3.5 is incompatible with astroid 4
        # (silently emits no API reference otherwise).
        run: pip install sphinx==7.2.6 sphinx-autoapi "astroid<4" "myst-parser>=2.0.0" furo sphinx-copybutton sphinx-design
      - name: Build HTML
        working-directory: libraries/getitrack
        run: sphinx-build -b html docs docs/_build/html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: libraries/getitrack/docs/_build/html

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the built site to GitHub Pages
      id-token: write # OIDC token required by the Pages deployment

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
