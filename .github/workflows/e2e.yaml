name: E2E tests

on:
  workflow_dispatch:
    inputs:
      E2E_BASE_URL:
        description: "Geti server base URL for E2E tests"
        required: false
        type: string
      BRANCH:
        description: "Branch to run E2E tests on"
        required: false
        type: string
  schedule:
    - cron: "0 2 * * *" # every day at 2 am

permissions:
  contents: read

concurrency:
  group: e2e-tests
  cancel-in-progress: false

jobs:
  e2e:
    name: E2E tests
    timeout-minutes: 60
    defaults:
      run:
        working-directory: application/ui
    env:
      E2E_BASE_URL: ${{ inputs.E2E_BASE_URL || vars.E2E_BASE_URL || 'https://10.91.103.115:8080' }}
    runs-on: innersource.prod.amr.dind
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - name: Check remote server
        run: |
          if [ -z "$E2E_BASE_URL" ]; then
            echo "E2E_BASE_URL is not set. Please set it in the workflow dispatch inputs."
            exit 1
          fi
          curl -fsS --insecure --max-time 30 "$E2E_BASE_URL/health"
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: application/ui/.nvmrc
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Install chromium
        run: npx playwright install chromium --with-deps
      - name: Run E2E tests
        run: npm run test:e2e -- tests/e2e/smoke.spec.ts
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: application/ui/playwright-report
          retention-days: 7
